<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Care - Mona Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #c5a880;
            --text-dark: #2b2d42;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --danger-color: #d90429;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        .back-nav {
            max-width: 1000px;
            margin: 20px auto 10px auto;
            padding: 0 20px;
            text-align: left;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 15px;
        }

        .header {
            text-align: center;
            padding: 10px 20px 30px 20px;
        }

        .header h1 {
            font-size: 38px;
            font-weight: 900;
            color: var(--primary-color);
            margin: 0;
            letter-spacing: 2px;
            font-family: 'Times New Roman', Times, serif;
        }

        .header h2 {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-dark);
            margin: 5px 0;
            letter-spacing: 3px;
            font-family: 'Times New Roman', Times, serif;
        }

        .header p {
            color: #8d99ae;
            font-size: 13px;
            letter-spacing: 1.5px;
            margin-top: 5px;
            text-transform: uppercase;
        }

.search-container {
    margin: 0 auto 30px auto;
    position: relative;
    max-width: 500px;
}
.search-container input {
    width: 100%;
    padding: 12px 40px 12px 12px;
    background-color: #f8f9fa;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-color);
    font-size: 15px;
    font-weight: 600;
    box-sizing: border-box;
    transition: all 0.3s ease;
}
.search-container input:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 4px 12px rgba(197, 168, 128, 0.15);
}
.search-container i {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 16px;
}


        .products-grid {
            max-width: 900px;
            margin: 0 auto 50px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .img-container {
            position: relative;
            width: 100%;
            padding-top: 120%;
        }

        .img-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sold-out-badge {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            background-color: rgba(217, 4, 41, 0.85);
            color: #ffffff;
            text-align: center;
            padding: 6px 0;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 1px;
            transform: translateY(-50%);
            text-transform: uppercase;
        }

        .product-info {
            padding: 12px 8px;
            text-align: center;
        }

        .product-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            color: #8d99ae;
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .modal-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .modal-qty {
            font-size: 14px;
            color: #6c757d;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* تنسيق زرار الواتساب الأخضر */
        .whatsapp-btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .whatsapp-btn:disabled {
            background-color: #ccc !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="index.html" class="btn-back">
            العودة للرئيسية <i class="fa-solid fa-arrow-left"></i>
        </a>
    </div>

    <div class="header">
        <h1>MONA</h1>
        <h2>SKIN CARE</h2>
        <p>ELEGANT SKIN CARE COLLECTION</p>
    </div>

<div class="search-container">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="search-input" placeholder="ابحث عن المنتج...">
</div>

  
    <div class="products-grid" id="products-container"></div>

    <div class="modal-overlay" id="product-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-title" id="modal-title">--</div>
            <div class="modal-price" id="modal-price">--</div>
            <div class="modal-qty" id="modal-qty">--</div>
            
            <button id="modal-whatsapp-btn" onclick="sendToWhatsApp()" class="whatsapp-btn">
                <i class="fa-brands fa-whatsapp"></i> اطلب الآن
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDSDPiVh9SeKelRuITttm3EQO5xhSJFVK0",
            authDomain: "mona-store-7c476.firebaseapp.com",
            projectId: "mona-store-7c476",
            storageBucket: "mona-store-7c476.firebasestorage.app",
            messagingSenderId: "1017880206778",
            appId: "1:1017880206778:web:9c72e613c71130611a9183",
            databaseURL: "https://mona-store-7c476-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const productsContainer = document.getElementById('products-container');
        const modal = document.getElementById('product-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalPrice = document.getElementById('modal-price');
        const modalQty = document.getElementById('modal-qty');
        const whatsappBtn = document.getElementById('modal-whatsapp-btn');

let allProducts = [];
const searchInput = document.getElementById('search-input');
      
        let currentProduct = { name: '', price: '' };

        database.ref('products/skin-care').on('value', (snapshot) => {
    allProducts = [];
    if (snapshot.exists()) {
        const items = snapshot.val();
        for (let id in items) {
            const item = items[id];
            if (item.name && item.name.trim() !== '') {
                allProducts.push({
                    name: item.name.trim(),
                    price: item.price || '',
                    qty: item.qty !== undefined ? parseInt(item.qty) : 0
                });
            }
        }
        renderProducts(allProducts);
    } else {
        productsContainer.innerHTML = '<p style="text-align:center; width:100%; color: #8d99ae;">لا توجد منتجات حالياً.</p>';
    }
});

function renderProducts(productsToRender) {
    productsContainer.innerHTML = '';
    
    if(productsToRender.length === 0) {
        productsContainer.innerHTML = '<p style="text-align:center; width:100%; grid-column: 1 / -1; color: #8d99ae;">لم يتم العثور على منتجات مطابقة للبحث.</p>';
        return;
    }

    productsToRender.forEach(prod => {
        const isSoldOut = prod.qty <= 0;
        const card = document.createElement('div');
        card.className = 'product-card';
        
        card.onclick = () => openModal(prod.name, prod.price, prod.qty);

        card.innerHTML = `
            <div class="img-container">
                <img src="images/${prod.name}.jpg" alt="${prod.name}" onerror="this.onerror=null;this.src='images/placeholder.jpg';">
                ${isSoldOut ? '<div class="sold-out-badge">SOLD OUT</div>' : ''}
            </div>
            <div class="product-info">
                <div class="product-title">${prod.name}</div>
            </div>
        `;
        productsContainer.appendChild(card);
    });
}

if(searchInput) {
    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
        renderProducts(filtered);
    });
}


        function openModal(name, price, qty) {
            currentProduct = { name, price };
            modalTitle.innerText = name;
            modalPrice.innerText = price + ' EGP';
            
            const quantity = parseInt(qty);

            if (quantity > 0) {
                modalQty.innerText = 'الكمية المتاحة: ' + qty;
                modalQty.style.color = '#2b9348';
                whatsappBtn.disabled = false;
                whatsappBtn.innerHTML = `<i class="fa-brands fa-whatsapp"></i> اطلب الآن`;
            } else {
                modalQty.innerText = 'غير متوفر حالياً';
                modalQty.style.color = '#d90429';
                whatsappBtn.disabled = true;
                whatsappBtn.innerHTML = `<i class="fa-brands fa-whatsapp"></i> غير متوفر حالياً`;
            }
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        function sendToWhatsApp() {
            const phoneNumber = "201147720724";
            const message = `مرحباً، أود طلب المنتج التالي:\n- المنتج: ${currentProduct.name}\n- السعر: ${currentProduct.price} EGP`;
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
