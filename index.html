<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mona Store</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="Mona.css">
</head>
<body>

    <header>
        <h1 class="store-title">Mona Store</h1>
        <p class="categories-sub">(Perfumes - Skin care - Hair care)</p>
        <p class="welcome-text">Welcome in Mona store</p>
        <p class="slogan">Where Elegance Meets Care</p>
    </header>

    <main class="gates-container">
        
        <div class="gates-row">
            <a href="perfumes.html" class="gate-card">
                <div class="image-wrapper">
                    <img src="perfume.jpg" alt="Perfumes">
                </div>
                <h2 class="gate-title">Perfumes</h2>
            </a>

            <a href="skincare-main.html" class="gate-card">
                <div class="image-wrapper">
                    <img src="skin.jpg" alt="Skin care & Hair care">
                </div>
                <h2 class="gate-title">Skin care & Hair care</h2>
            </a>
        </div>

        <div class="gates-row-full">
            <a href="korean.html" class="gate-card-wide">
                <div class="image-wrapper-wide">
                    <img src="Korean.jpg" alt="Korean products">
                </div>
                <h2 class="gate-title">Korean products</h2>
            </a>
        </div>

    </main>

    <footer>
        <div class="whatsapp-contact">
            <p class="contact-title">للتواصل عبر واتساب</p>
            <a href="https://wa.me/201147720724?text=مرحباً%20Mona%20Store،%20لدي%20إستفسار" class="whatsapp-link" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" class="whatsapp-icon">
            </a>
        </div>

        <p class="prayer-text">اللهم ارزقنا رزقاً حلالاً طيباً مباركاً فيه، وبارك لنا فيما أعطيتنا.</p>
    </footer>

    <script src="Mona.js"></script>
</body>
</html>
